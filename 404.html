    <script>
      (function () {
        // 1. Browser compatibility polyfills (URL.parse, Promise.withResolvers, global/process)
        if (typeof window !== 'undefined') {
          window.global = window.global || window;
          window.process = window.process || { env: {} };
          if (typeof window.process.getBuiltinModule !== 'function') {
            window.process.getBuiltinModule = function () {
              return undefined;
            };
          }
          if (typeof URL !== 'undefined' && typeof URL.parse !== 'function') {
            URL.parse = function (url, base) {
              try {
                return base ? new URL(url, base) : new URL(url);
              } catch (_e) {
                return null;
              }
            };
          }
          if (typeof Promise !== 'undefined' && typeof Promise.withResolvers !== 'function') {
            Promise.withResolvers = function () {
              var resolve, reject;
              var promise = new Promise(function (res, rej) {
                resolve = res;
                reject = rej;
              });
              return { promise: promise, resolve: resolve, reject: reject };
            };
          }
        }

        // 2. Fix GitHub Pages relative asset paths when loaded without trailing slash
        // Works even if repository name contains a dot (e.g. cloudplay.v4 or tinhoc.thcs)
        var path = window.location.pathname;
        var lastSeg = path ? path.split('/').pop() || '' : '';
        var isStaticFile = /\.(html?|json|xml|txt|ico|png|jpe?g|webp|svg|js|mjs|css|webmanifest|map|woff2?)$/i.test(lastSeg);
        if (path && !path.endsWith('/') && !isStaticFile) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
          return;
        }

        // 3. Fallback loader when GitHub Pages serves raw root index.html from 'main' branch
        var fallbackLoaded = false;
        window.__loadGitHubPagesFallback = function () {
          if (fallbackLoaded || window.__CLOUDPLAY_BOOTSTRAPPED__) return;
          fallbackLoaded = true;
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './gh-pages-dist/app.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.src = './gh-pages-dist/app.js';
          document.head.appendChild(script);
        };

        // 4. Clear any stale Service Worker that previously cached a blank page on github.io
        if (window.location.hostname.indexOf('github.io') !== -1 && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].update();
            }
          }).catch(function () {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
      onerror="window.__loadGitHubPagesFallback && window.__loadGitHubPagesFallback()"
    ></script>
    <script>
      (function () {
        var rawDevScript = document.querySelector('script[src*="/src/main.tsx"]');
        if (rawDevScript) {
          if (window.location.hostname.indexOf('github.io') !== -1) {
            window.__loadGitHubPagesFallback();
          }
        }
      })();
    </script>
  </body>
